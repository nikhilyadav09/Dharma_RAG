name: Keep backend awake

# Render's free tier spins the service down after 15 minutes with no
# incoming requests, causing a slow cold start (ML model reload) on the
# next real user request. Pinging /health every 10 minutes keeps it warm.
# Public-repo GitHub Actions minutes are unlimited and free, so this
# costs nothing.
#
# Note: GitHub may delay scheduled runs by a few minutes under load, and
# disables `schedule` triggers automatically after 60 days with no commits
# to the repo (re-enable from the Actions tab if that happens).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -sf -m 20 https://api.dharma.nikhilyadav.dev/health \
            && echo "OK" \
            || echo "Ping failed (service may be cold-starting or down)"
